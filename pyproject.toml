[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairwise-eval"
version = "0.1.0"
description = "A small toolkit for aligning pairwise preferences with numerical evaluation scores."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pairwise-eval contributors" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
pairwise-eval = "pairwise_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
